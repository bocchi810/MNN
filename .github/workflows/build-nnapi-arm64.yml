name: build-nnapi-arm64

# 手动触发：Actions 页面点 "Run workflow"
on:
  workflow_dispatch:
    inputs:
      build_llm:
        description: '是否构建 LLM 部分（MNN_BUILD_LLM）'
        type: boolean
        default: true
      run_on_push:
        description: '仅用于测试：本文件被推送时是否自动构建一次'
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/build-nnapi-arm64.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: 判断是否该跑（push 触发时需要显式打开）
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ inputs.run_on_push }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "push 触发且未勾选 run_on_push，跳过构建。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 检出源码
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: 安装 CMake 3.28（存在则跳过）（避开 CMP0175：MNN 给 OBJECT 库挂 POST_BUILD）
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -e
          # runner 预装的是 CMake 3.31.5 / 4.1.2，都 ≥3.31，配 MNN 会撞 CMP0175；
          # 这里固定 3.28.3。注意 3.31.5 那套也救不了（该限制与 policy 版本无关）。
          if ! cmake --version | head -1 | grep -q "3\.28\.3"; then
            python3 -m pip install --quiet "cmake==3.28.3"
          fi
          cmake --version | head -1

      - name: 安装 ccache（编译对象缓存，命中时大幅缩短重编时间）
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -e
          if ! command -v ccache >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ccache
          fi
          ccache --version | head -1

      - name: 缓存 NDK r27c（避免每次重下 665MB）
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: android-ndk-r27c
          key: android-ndk-r27c-linux

      - name: 缓存 ccache 对象文件
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          # 滚动 key：Actions 的缓存条目一经写入不可覆盖（immutable），所以 key 里放 run_id
          # 让每次运行都写一份新快照，restore-keys 再取最近一份来复用。
          # 反过来若把 commit sha 放进 key，就会每次改工作流都换新 key、永远命不中——ccache 等于白加。
          # 源码变化本身由 ccache 按内容哈希判断，不需要体现在 key 里。
          # 配额：ccache 上限 1G + NDK 约 2G，远低于仓库默认 10G。
          key: ccache-nnapi-v1-${{ github.run_id }}
          restore-keys: |
            ccache-nnapi-v1-

      - name: 安装 Android NDK r27c
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -e
          if [ ! -d android-ndk-r27c ]; then
            curl -sSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
            unzip -q ndk.zip
            rm -f ndk.zip
          else
            echo "NDK 命中缓存，跳过下载"
          fi
          echo "ANDROID_NDK=$PWD/android-ndk-r27c" >> "$GITHUB_ENV"
          echo "NDK 就绪: $ANDROID_NDK"

      - name: 配置 ccache（大小上限 1G，避免挤占仓库 10GB 缓存配额）
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -e
          ccache --set-config=max_size=1G
          ccache --set-config=compression=false
          ccache --set-config=base_dir="$GITHUB_WORKSPACE"
          ccache -z          # 清零统计，便于看本次命中率
          ccache -p | grep -E "max_size|base_dir|compression"
          ccache -s | head -5

      - name: 配置（arm64-v8a + NNAPI）
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -e
          mkdir -p build-nnapi && cd build-nnapi
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_STL=c++_shared \
            -DANDROID_NATIVE_API_LEVEL=android-21 \
            -DANDROID_PLATFORM=android-21 \
            -DMNN_USE_LOGCAT=true \
            -DMNN_ARM82=true \
            -DMNN_OPENCL=true \
            -DMNN_LOW_MEMORY=true \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=true \
            -DMNN_BUILD_LLM=${{ inputs.build_llm == false && 'false' || 'true' }} \
            -DMNN_NNAPI=true \
            -DMNN_BUILD_BENCHMARK=true \
            -DMNN_BUILD_DEMO=true \
            -DMNN_BUILD_TOOLS=true \
            -DMNN_BUILD_TEST=false \
            -DMNN_SEP_BUILD=false \
            -DMNN_BUILD_FOR_ANDROID_COMMAND=true
          # 为什么需要最后这个开关（已本地逐条验证）：
          # MNN 官方 3.6.1 的 transformers/llm/engine/CMakeLists.txt:72-81 给 OBJECT 库 llm
          # 挂了 add_custom_command(... POST_BUILD ...)，CMake 会直接报错：
          #   Target "llm" is an OBJECT library that may not have PRE_BUILD/PRE_LINK/POST_BUILD
          #   commands.
          # 该分支的条件是 (Android AND NOT MNN_BUILD_FOR_ANDROID_COMMAND)，加上这个开关即走
          # 官方 ELSE 分支（INSTALL 头文件）。它的其它副作用都在 IF(MNN_SEP_BUILD) 内，而我们
          # 用的是 MNN_SEP_BUILD=false，因此这里只起到"绕开非法 POST_BUILD"的作用。
          # 好处：fork 里无需修改任何 MNN 源码。
          grep -E "^MNN_NNAPI" CMakeCache.txt

      - name: 编译
        if: steps.gate.outputs.skip != 'true'
        run: cmake --build build-nnapi -j"$(nproc)"

      - name: ccache 命中率报告
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "=== ccache 统计（本次）==="
          ccache -s
          echo "=== ccache 目录占用 ==="
          du -sh ~/.cache/ccache 2>/dev/null || true

      - name: 校验 NNAPI 后端确实编进去了（缺失则本 job 失败）
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # 上一版两次踩坑，这里全部规避：
          #  1) 发布用 libMNN.so 是 stripped 的，`nm` 只会回 "no symbols" —— 不能作为判据；
          #  2) 开启 pipefail 后，`grep` 无匹配返回 1、`head` 提前关闭管道使上游收到 SIGPIPE(141)，
          #     都会让脚本在判定之前就退出（上一版误报"缺少 NNAPI"就是这么来的）。
          # 因此：先把 strings 落成文件，再在文件上统计与截断，全程不做短管道。
          LIB=$(find build-nnapi -maxdepth 1 -name "libMNN.so" | head -1)
          echo "libMNN.so: $LIB"
          command -v file >/dev/null && file "$LIB" || echo "(file 命令不可用，跳过架构打印)"
          strings -a "$LIB" > /tmp/libMNN.strings

          echo "--- 证据1/3：字符串表里的 NNAPI 日志标记 ---"
          STR_HITS=$(grep -c -E "libneuralnetworks\.so|\[NNAPI\]" /tmp/libMNN.strings || true)
          grep -E "libneuralnetworks\.so|\[NNAPI\]" /tmp/libMNN.strings | sort -u > /tmp/nnapi-hits.txt || true
          sed -n '1,15p' /tmp/nnapi-hits.txt
          echo "字符串命中数: $STR_HITS"

          echo "--- 证据2/3：动态符号表（strip 后 .dynsym 保留，但不保证含 nnapi 字样）---"
          readelf --dyn-syms -W "$LIB" > /tmp/libMNN.dynsyms 2>/dev/null || true
          DYNSYM_HITS=$(grep -c -i "nnapi" /tmp/libMNN.dynsyms || true)
          echo "动态符号命中数: $DYNSYM_HITS"

          echo "--- 证据3/3：未 strip 的目标文件里的后端实现符号 ---"
          OBJ=$(find build-nnapi -name "NNAPIBackend.cpp.o" | head -1)
          echo "目标文件: $OBJ"
          OBJ_HITS=0
          if [ -n "$OBJ" ]; then
            nm -C --defined-only "$OBJ" > /tmp/nnapi-obj.syms 2>/dev/null || true
            OBJ_HITS=$(grep -c -i "nnapi" /tmp/nnapi-obj.syms || true)
            grep -i "nnapi" /tmp/nnapi-obj.syms > /tmp/nnapi-syms.txt || true
            sed -n '1,6p' /tmp/nnapi-syms.txt
          fi
          echo "目标文件符号命中数: $OBJ_HITS"

          if [ "${STR_HITS:-0}" -eq 0 ] && [ "${OBJ_HITS:-0}" -eq 0 ]; then
            echo "::error::既没有 NNAPI 字符串、也没有 NNAPI 目标文件符号，MNN_NNAPI 很可能没生效"
            exit 1
          fi
          echo "OK: NNAPI 后端已编入（字符串命中 $STR_HITS，目标文件符号命中 $OBJ_HITS）"

          echo "--- 确认没有任何 NeuroPilot 残留（3.6.x 已移出公开仓库）---"
          NP_HITS=$(grep -c -i "neuropilot" /tmp/libMNN.strings || true)
          if [ "${NP_HITS:-0}" -gt 0 ]; then
            echo "::warning::出现 NeuroPilot 字符串，请检查源码版本"
          else
            echo "无 NeuroPilot 残留（符合 3.6.1 已移出公开仓库的事实）"
          fi

      - name: 打包产物 + 设备自检包
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -e
          mkdir -p out/lib out/bin
          # 动态库
          find build-nnapi -name "*.so" -exec cp -v {} out/lib/ \;
          # 自检/基准工具
          for t in benchmark.out backendTest.out MNNV2Basic.out GetMNNInfo; do
            f=$(find build-nnapi -name "$t" -type f | head -1)
            if [ -n "$f" ]; then cp -v "$f" out/bin/; else echo "未找到 $t（跳过）"; fi
          done
          # 小 CNN 模型：NNAPI 覆盖得住的场景，用于设备自检
          mkdir -p out/models
          cp -v benchmark/models/mobilenet-v1-1.0.mnn out/models/ 2>/dev/null || true
          cp -v benchmark/models/SqueezeNetV1.0.mnn out/models/ 2>/dev/null || true
          (cd out && find . -type f -exec sha256sum {} \; | sort -k2 > SHA256SUMS.txt)
          tar czf mnn-nnapi-arm64.tar.gz -C out .
          ls -la mnn-nnapi-arm64.tar.gz

      - name: 上传产物
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mnn-nnapi-arm64
          path: |
            mnn-nnapi-arm64.tar.gz
            out/
          if-no-files-found: error
